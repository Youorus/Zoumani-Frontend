name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push qui en remplace un autre annule la CI devenue obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
        env:
          # Valeurs de substitution : le build doit reussir sans secret.
          NEXT_PUBLIC_APP_URL: https://zoumani.fr

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verifie que l'image que Dokploy va construire se build bien.
      # Sans push : la construction reelle a lieu sur le serveur.
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://zoumani.fr
          cache-from: type=gha
          cache-to: type=gha,mode=max
